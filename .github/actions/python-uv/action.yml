name: Python and uv
description: >-
  The toolchain every confiture job starts from: a Python interpreter, uv, and
  (with native) the stable Rust toolchain plus maturin to build confiture._core.
  Each job still owns its `uv venv` / `uv sync` line, since the extras differ.

inputs:
  python-version:
    description: Interpreter version for actions/setup-python.
    required: true
  native:
    description: "'true' also installs the Rust toolchain and maturin."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Setup Rust toolchain
      if: inputs.native == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Install maturin
      if: inputs.native == 'true'
      shell: bash
      run: uv tool install maturin
