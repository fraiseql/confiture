name: Lockfile Bump

# Committing uv.lock (#191) makes CI reproducible, but a pinned lock that is
# never refreshed just trades red-on-an-unrelated-PR for silently rotting
# dependencies. This job proposes the upgrade on its own branch, so an upstream
# break is triaged where it belongs instead of ambushing whoever opens the next
# feature PR — which is exactly what pglast 8.2 did to #183.
#
# It pushes the branch and files an issue; it does NOT open the pull request.
# The `fraiseql` organisation forbids Actions from creating pull requests, and
# that policy cannot be overridden per repository:
#
#     ##[error]GitHub Actions is not permitted to create or approve pull requests.
#
# So the job used to run to completion — upgrade, commit, push — and fail on its
# last step, every Monday, for a reason no commit could cause. Opening the PR is
# one click from the issue, and it is that PR, not this job, that runs the gate.

on:
  schedule:
    # Mondays 06:00 UTC — early in the week, so a red bump PR has working days
    # left in it rather than landing on a Friday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lockfile-bump
  cancel-in-progress: true

env:
  BUMP_BRANCH: chore/lockfile-bump
  ISSUE_TITLE: 'chore(deps): lockfile refresh available'

jobs:
  bump:
    name: Propose dependency upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Upgrade lockfiles
        id: upgrade
        run: |
          uv lock --upgrade
          cargo update
          if git diff --quiet -- uv.lock Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<EOF'
              git diff --stat -- uv.lock Cargo.lock
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Push the bump branch
        if: steps.upgrade.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BUMP_BRANCH"
          git add uv.lock Cargo.lock
          git commit -m "chore(deps): refresh uv.lock and Cargo.lock" -m \
            "Scheduled \`uv lock --upgrade\` + \`cargo update\`. The full quality gate runs on the pull request opened from this branch, so an upstream break surfaces there rather than on an unrelated change (#191)."
          # Plain --force: this branch is produced by this job and nothing else,
          # it is rebuilt from main every run, and the concurrency group above
          # means two runs never race for it. --force-with-lease would need a
          # remote-tracking ref that a fetch-depth-1 checkout has not got.
          git push --force origin "HEAD:refs/heads/$BUMP_BRANCH"

      - name: Report the branch on an issue
        if: steps.upgrade.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.upgrade.outputs.summary }}
        run: |
          compare="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...${BUMP_BRANCH}?expand=1"
          body=$(cat <<EOF
          Scheduled dependency refresh — \`uv lock --upgrade\` and \`cargo update\` — is
          pushed to [\`${BUMP_BRANCH}\`](${{ github.server_url }}/${{ github.repository }}/tree/${BUMP_BRANCH}).

          \`\`\`
          ${SUMMARY}
          \`\`\`

          **[Open the pull request](${compare})** — the quality gate runs on the PR, not on
          this job, so nothing has been verified yet. This workflow cannot open it itself:
          the organisation does not permit GitHub Actions to create pull requests.

          **If the gate is red on that PR, that is the mechanism working.** An upstream
          release broke something; triage it there. Do not merge a red bump, and do not
          work around it on an unrelated branch — that is the failure mode #191 exists to
          prevent.

          Reviewing: skim the diff for major-version jumps, confirm the gate is green, merge.

          _Updated by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._
          EOF
          )
          existing=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body" --label dependencies
          fi
