name: Python Version Matrix Tests

# The next CPython, above the floor. The quality gate runs the suite on the one
# supported interpreter for every pull request, with coverage; this workflow runs
# it on the interpreter after it, by hand, before that one is declared. A matrix
# cannot be empty, so while no final CPython above the floor builds the package
# there is no list to run on main and nightly: run it with the version to try.
on:
  workflow_dispatch:
    inputs:
      python-version:
        description: The CPython above the floor to run the suite on (e.g. 3.15).
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: python-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      # uv resolves the interpreter for `venv`, `sync` and `run` from UV_PYTHON
      # first; without it, `uv sync`/`uv run` fall back to the project default
      # (.python-version) and silently rebuild the venv the previous step created (#209).
      UV_PYTHON: ${{ matrix.python-version }}

    strategy:
      fail-fast: false  # Continue testing other versions even if one fails
      matrix:
        python-version: ['${{ inputs.python-version }}']

    services:
      postgres:
        # PostgreSQL 16 only: this matrix varies the interpreter, not the server; the
        # quality gate runs the suite on 16 and 18 (#608).
        image: postgres:16
        env:
          POSTGRES_USER: confiture
          POSTGRES_PASSWORD: confiture
          POSTGRES_DB: confiture_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python and uv
      uses: ./.github/actions/python-uv
      with:
        python-version: ${{ matrix.python-version }}
        native: 'true'

    - name: Setup environment and install dependencies
      run: |
        echo "=== Python Version Info ==="
        python --version

        # Create the virtual environment ON THE MATRIX INTERPRETER. Without
        # --python, uv picks its own and every leg runs the same Python (#209).
        uv venv --python "${{ matrix.python-version }}"

        echo "=== Installing Confiture dependencies ==="
        # Include [notifications] (jinja2) so the full test suite has its
        # optional dependencies satisfied.
        # Sync from the committed uv.lock (#191). uv resolves universally, so
        # one lock serves every Python in the matrix.
        uv sync --locked --extra dev --extra notifications

        echo "=== Building Rust extension with maturin ==="
        uv run maturin develop --uv

        echo "=== Verifying Installation ==="
        uv run python -c "import confiture; print(f'Confiture version: {confiture.__version__}')"
        uv run python -c "from confiture.core.builder import HAS_RUST; print(f'Rust extension loaded: {HAS_RUST}')"

    - name: Verify the interpreter is the matrix entry
      # The claim this workflow makes is "tested on the matrix entry"; this
      # step is what makes a leg that silently runs another version fail (#209).
      run: |
        uv run python -c "import sys; expected = tuple(int(p) for p in '${{ matrix.python-version }}'.split('.')); assert sys.version_info[:2] == expected, f'venv runs {sys.version}, matrix entry is ${{ matrix.python-version }}'; print('interpreter', sys.version)"

    - name: Verify Environment
      run: |
        echo "=== Environment Verification ==="
        uv run python --version
        uv --version
        uv run pytest --version
        rustc --version

        echo "=== PostgreSQL Health Check ==="
        pg_isready -h localhost -p 5432 -U confiture && echo '✅ PostgreSQL Ready' || echo '❌ PostgreSQL Not Ready'

        echo "=== Database Connection Test ==="
        uv run python -c "import psycopg; conn = psycopg.connect('postgresql://confiture:confiture@localhost:5432/confiture_test'); print('✅ DB connection successful'); conn.close()"

        echo "=== Rust Extension Verification ==="
        uv run python -c "from confiture.core.builder import HAS_RUST; print(f'✅ Rust available: {HAS_RUST}')"

    - name: Create test databases
      run: |
        PGPASSWORD=confiture psql -h localhost -U confiture -c "SELECT 1;" confiture_test || PGPASSWORD=confiture psql -h localhost -U confiture -d postgres -c "CREATE DATABASE confiture_test;"
        PGPASSWORD=confiture psql -h localhost -U confiture -c "SELECT 1;" confiture_source_test || PGPASSWORD=confiture psql -h localhost -U confiture -d postgres -c "CREATE DATABASE confiture_source_test;"
        PGPASSWORD=confiture psql -h localhost -U confiture -c "SELECT 1;" confiture_target_test || PGPASSWORD=confiture psql -h localhost -U confiture -d postgres -c "CREATE DATABASE confiture_target_test;"

    - name: Run tests with pytest
      env:
        # See quality-gate.yml: CONFITURE_TEST_DB_URL is the variable the
        # test fixtures read; without it the service container is unused and the
        # DB-backed suite silently skips.
        CONFITURE_TEST_DB_URL: postgresql://confiture:confiture@localhost:5432/confiture_test
        CONFITURE_SOURCE_DB_URL: postgresql://confiture:confiture@localhost:5432/confiture_source_test
        CONFITURE_TARGET_DB_URL: postgresql://confiture:confiture@localhost:5432/confiture_target_test
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: confiture
        POSTGRES_PASSWORD: confiture
        POSTGRES_DB: confiture_test
      run: |
        echo "=== Running Tests on Python ${{ matrix.python-version }} ==="

        uv run pytest tests/ \
          -n auto \
          -rs \
          --tb=short \
          || {
            echo "❌ Tests failed on Python ${{ matrix.python-version }}"
            exit 1
          }

        echo "✅ All tests passed on Python ${{ matrix.python-version }}"

  # Summary job to check if all Python versions passed
  matrix-summary:
    name: Python Version Matrix Summary
    runs-on: ubuntu-latest
    needs: [test-matrix]
    if: always()

    steps:
      - name: Check matrix results
        run: |
          echo "=== Python Version Matrix Test Results ==="

          if [[ "${{ needs.test-matrix.result }}" == "success" ]]; then
            echo "✅ Python ${{ inputs.python-version }} tests passed"
            exit 0
          else
            echo "❌ Python version testing failed"
            echo "⚠️  Check the individual job results above for details"
            exit 1
          fi
