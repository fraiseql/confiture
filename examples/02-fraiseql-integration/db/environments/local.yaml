# Local Development Environment Configuration
#
# Used by `confiture build --env local` and `confiture migrate ... --env local`.

name: local
database_url: postgresql://postgres:postgres@localhost:5432/fraiseql_blog

# Include directories (processed in order)
include_dirs:
  - db/schema/00_extensions
  - db/schema/10_tables
  - db/schema/20_indexes

# Exclude directories (optional)
exclude_dirs: []
