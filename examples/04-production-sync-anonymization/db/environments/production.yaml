# Production database — the SOURCE of `confiture sync`.
#
# Use read-only credentials: sync never writes to its source. The password is
# resolved from the environment at load time (${VAR} expansion).

name: production
database_url: postgresql://confiture_sync_user:${PROD_DB_PASSWORD}@prod-db.example.com:5432/ecommerce_prod?sslmode=require

# This example syncs data between existing databases; it builds no schema.
include_dirs: []
exclude_dirs: []
