# Production environment — every connection detail comes from the environment.

name: production
database_url: postgresql://${PRODUCTION_DB_USER}:${PRODUCTION_DB_PASSWORD}@${PRODUCTION_DB_HOST}:${PRODUCTION_DB_PORT}/${PRODUCTION_DB_NAME}?sslmode=require&connect_timeout=15

include_dirs:
  - db/schema
exclude_dirs: []

# Production-specific options
options:
  migration_timeout: 600  # 10 minutes
  verbose: true
  require_dry_run: true
  require_backup: true
  require_approval: true
  allow_drop_tables: false
  allow_drop_columns: false
  lock_timeout: 30000  # 30 seconds
  statement_timeout: 300000  # 5 minutes
