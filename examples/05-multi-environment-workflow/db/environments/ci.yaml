name: ci

database_url: postgresql://postgres:postgres@localhost:5432/confiture_ci

# Which directories to include when building schema.
#
# Two blocks. `order` decides the sequence — not the order the entries are
# listed in — so the extensions block below is concatenated first even though
# it is written second. Both entries select the files under 00_common/; the
# lower `order` owns them, and each file is built once.
#
# `exclude` is a gitignore-style glob matched against the path relative to the
# entry's own directory, which is why the same file is spelled two ways here.
include_dirs:
  - path: db/schema
    order: 10
    exclude:
      - "00_common/roles.sql"   # production-only in CI

  - path: db/schema/00_common
    order: 5
    exclude:
      - "roles.sql"             # the same file, relative to this entry

# CI-specific options
options:
  # Keep indexes for realistic tests
  skip_slow_indexes: false

  # Detailed logging for debugging CI failures
  verbose: true

  # Fail fast on any error
  strict_mode: true

  # Parallel execution for speed
  parallel_build: true

  # Allow test cleanup
  allow_drop_tables: true
  allow_drop_columns: true
