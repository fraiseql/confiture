[project]
name = "fraiseql-confiture-pggit"
version = "0.1.0"
description = "pgGit branching and multi-agent coordination commands for confiture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fraiseql-confiture>=1.16",
]

[project.entry-points."confiture.plugins"]
pggit = "confiture_pggit.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confiture_pggit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The plugin's tests run inside confiture's repository: its database fixtures are
# confiture's (`tests/conftest.py`), and confiture is the tree beside them.
pythonpath = ["../..", "../../python", "src"]
addopts = ["--strict-markers", "--tb=short", "-m", "not benchmark"]
markers = [
    "benchmark: Asserts an upper bound on a measured duration; excluded by default",
    "optional_extension: needs the pgGit extension, which a runner may not have",
]

[tool.ruff]
# confiture's rules, read from the repository this plugin lives in.
extend = "../../pyproject.toml"
src = ["src", "../../python"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101", "SIM117", "SIM105", "PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "C901"]
# What these modules carried in confiture's budgets when they left it (1.16).
"src/confiture_pggit/cli/coordinate.py" = ["PLR0913"]
"src/confiture_pggit/cli/generate.py" = ["PLR2004"]
"src/confiture_pggit/client.py" = ["PLR2004"]
"src/confiture_pggit/exceptions.py" = ["PLR2004"]
"src/confiture_pggit/generator.py" = ["PLR2004"]
