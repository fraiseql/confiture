[project]
name = "fraiseql-confiture"
version = "0.54.0"
description = "PostgreSQL schema evolution with built-in multi-agent coordination 🍓"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "evoludigit", email = "lionel.hamayon@evolution-digitale.fr"}
]
keywords = [
    "postgresql",
    "migration",
    "database",
    "schema",
    "ddl",
    "coordination",
    "multi-agent",
    "collaboration",
    "conflict-detection",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "psycopg[binary,pool]>=3.1.0",
    "sqlglot>=28.0",
    # PostgreSQL's own parser (libpg_query) — the one parser since 0.50.0 (D13).
    # Uncapped since 0.39.0 (#192): enum members are resolved by name through
    # `core/_pglast_enums.py`, `tests/unit/test_pglast_enum_binding.py` guards the
    # binding, and CI runs the AST suites on both ends of the range.
    "pglast>=6.0",
]

[project.optional-dependencies]
testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-json-report>=1.5.0",
    "pytest-xdist>=3.0.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0.0",  # -n / --dist=loadfile: addopts assumes it is installed
    "pytest-watch>=4.2.0",
    "pytest-json-report>=1.5.0",
    "ruff>=0.6.0",
    "ty>=0.0.7",  # Astral's ultra-fast type checker (replaces mypy)
    "maturin>=1.7.0",
    "fastapi>=0.111",
    "httpx>=0.27",
    "jsonschema>=4",  # Validate JSON output schemas in docs/reference/json-schemas/
]

fraiseql = [
    # FraiseQL integration (requires Python 3.13+)
]

# fraiseql-uuid is the CANONICAL home for the structured pattern-UUID convention
# (the {table}{type}-{func}-4{scen}-8{...}-{inst} v4-compliant encoding). Confiture's
# seed-validation only does generic RFC-4122 *format* checks and deliberately keeps
# NO parallel copy of that convention — the old uuid_patterns/uuid_validator island
# was deleted (ECO-rec2). This OPT-IN extra pulls in the canonical definition for
# projects that want structured-pattern validation, and lets the convention-seam
# guard test (tests/unit/test_uuid_convention_seam.py) assert alignment when present.
# Core install never requires it. It IS present in the type-check leg, which syncs
# --all-extras; the test legs sync only dev/notifications/ast, so the seam test's
# alignment half stays skipped there.
seed-uuid = [
    "fraiseql-uuid>=0.1.3",
]

# Empty alias since 0.50.0: pglast is a dependency. `fraiseql-confiture[ast]` still
# resolves for one release; the extra is removed in 1.0.0.
ast = []

mcp-http = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.0",
]
notifications = [
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/fraiseql/confiture"
Documentation = "https://github.com/fraiseql/confiture"
Repository = "https://github.com/fraiseql/confiture"
Issues = "https://github.com/fraiseql/confiture/issues"
FraiseQL = "https://github.com/fraiseql/fraiseql"

[project.scripts]
confiture = "confiture.cli.main:app"

[project.entry-points."pytest11"]
confiture = "confiture.testing.pytest_plugin"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "confiture._core"
features = ["extension-module"]
include = [
    { path = "python/confiture/schemas/*.json", format = "wheel" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["python"]
addopts = [
    "--strict-markers",
    "--tb=short",
    # Under -n N, keep every test of a module on one worker: modules that create
    # server-global objects (roles) reuse fixed names, and per-worker databases
    # only isolate what lives inside a database.
    "--dist=loadfile",
    # Wall-clock assertions pass or fail with the load on the machine; they run
    # only when asked for (`-m benchmark`, the performance workflow).
    "-m",
    "not benchmark",
]
markers = [
    # Layer markers — assigned from the directory by tests/conftest.py.
    "unit: Unit tests (no database required)",
    "integration: Integration tests (require database)",
    "e2e: End-to-end tests (full workflows)",
    "performance: Performance suites (tests/performance)",
    "contract: Adapter contract tests (tests/contract)",
    # Orthogonal markers.
    "slow: Slow tests (skip in fast CI)",
    "benchmark: Asserts an upper bound on a measured duration; excluded by default",
]

[tool.coverage.run]
source = ["python/confiture"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/testing/fixtures/*",  # Test infrastructure, not application code
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python"]
# One extractor-coverage fixture is deliberately unparsable (it pins the
# `syntax_error` warning); ruff cannot lint what it cannot parse.
extend-exclude = ["tests/fixtures/idempotency_shapes/db/migrations/20260101000030_syntax_error.py"]

[tool.ruff.lint]
# Deliberate, focused ruleset (see ARCH-M3). Confiture runs a curated core
# rather than the full prescribed superset: the families below catch real bugs
# and style drift with near-zero false positives. The heavier / more opinionated
# families (PL, PERF, FURB, ERA, PTH, TCH, RUF) are intentionally NOT enabled —
# enabling the full set surfaces ~900+ findings (much of it churn) without
# commensurate value today. Adopt them incrementally, family-by-family, if a
# future need earns it. This config — not the global methodology — is the
# source of truth for Confiture's lint scope.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RUF",  # ruff-specific rules (Phase 11, D6); RUF100 alone since Phase 08
    "ERA",  # commented-out code (Phase 11, D6): prose comments that parse as code are reworded
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "UP042",  # StrEnum migration changes str() semantics; code/tests rely on the
    # (str, Enum) form (e.g. str(LintSeverity.ERROR) == "LintSeverity.ERROR").
    # Typographic characters (ℹ → — …) in user-facing strings, docstrings and comments
    # are deliberate; the confusable-character rules would flag every one of them.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Allow assert statements and nested with statements in tests
# SIM117: Nested with statements are often clearer in tests with many patches
# SIM105: try-except-pass is acceptable for "expected to fail" test scenarios
"tests/*" = ["ARG", "S101", "SIM117", "SIM105"]
# Migration subclasses set hook/precondition lists as plain class attributes — that is
# the Migration API as documented; the examples show it as users write it.
"examples/*" = ["RUF012"]
# Extractor-coverage fixtures pin argument *shapes*, some of them deliberately
# wrong: an unbound name (F821) and %-formatting (UP031) are the shapes.
"tests/fixtures/idempotency_shapes/*" = ["F821", "UP031"]

[tool.ty.src]
# Astral's ultra-fast type checker configuration
# Includes Python source code, excludes tests and examples
include = ["python"]
exclude = ["examples", "tests", "**/test_*.py"]

[tool.ty.environment]
python-version = "3.11"
root = ["python"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.rules]
# psycopg3 uses strict type requirements (LiteralString for SQL queries).
# This library is designed to execute dynamic SQL from:
# - Migration files (trusted developer content)
# - Schema building (concatenated SQL files)
# - SAVEPOINT/ROLLBACK commands (safe, controlled strings)
# These are safe operations that can't be made type-safe without major refactoring.
invalid-argument-type = "ignore"

# Strategy configs use dynamic attribute access that the type checker can't verify.
# The base StrategyConfig class is extended by subclasses with additional fields,
# but the type system only sees the base class type in generic code.
possibly-missing-attribute = "ignore"

# psycopg 3.3+ types execute() to accept only LiteralString/SQL/Composed (an
# anti-SQL-injection guardrail). Confiture builds dynamic SQL from double-quoted,
# validated identifiers (each call site carries `# nosec B608`), so the runtime
# string never matches the overload. (Was `invalid-argument-type` under older ty.)
no-matching-overload = "ignore"

[[tool.ty.overrides]]
# pglast AST nodes are dynamically typed (Unknown | None); attribute access on
# them isn't statically resolvable. Scope the suppression to the AST-visitor
# modules so first-party attribute errors stay caught everywhere else.
include = [
    "python/confiture/core/migration_grant_extractor.py",
    "python/confiture/core/linting/libraries/ownership.py",
    "python/confiture/core/linting/libraries/functions.py",
    "python/confiture/core/replica/classifier.py",
]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[dependency-groups]
dev = [
    "maturin>=1.9.6",
    "ruff==0.15.15",
]
